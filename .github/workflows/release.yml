name: release
# Publishes to npm when a version tag (v0.1.0, ...) is pushed. Runs every gate first.
# Auth: npm trusted publishing (OIDC, no token) once configured on npmjs.com; until
# then, the NPM_TOKEN secret (a short-lived granular token) is used for the first publish.
# Provenance is attached automatically; npm only shows it for public repos.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: quota
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
      upstash:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: ci_test_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ['8079:80']
    env:
      REQUIRE_SERVICE_STORES: '1'
      DATABASE_URL: postgres://postgres:test@localhost:5432/quota
      REDIS_URL: redis://localhost:6379
      UPSTASH_REDIS_REST_URL: http://localhost:8079
      UPSTASH_REDIS_REST_TOKEN: ci_test_token
      PROPERTY_RUNS: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:registry
      - run: npm run coverage
      - run: npm run build
      - run: npm run lint:pkg
      - run: npm run check:size
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "ai-sdk-quota@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
