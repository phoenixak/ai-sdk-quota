name: leaks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary scans the whole history; the action fails on a repo's first push.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
          rm gitleaks
      - run: sh scripts/check-private-terms.sh
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
